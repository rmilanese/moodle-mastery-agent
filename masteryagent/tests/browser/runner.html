<script>
const pending = [];
let filterUpdates = 0;
let filterFailure = false;
window.define = (name, deps, factory) => {
    const exports = {};
    const modules = {require: () => {}, exports,
        'core/ajax': {call: requests => requests.map(request => new Promise((resolve, reject) => {
            pending.push({request, resolve, reject});
        }))},
        'core_filters/events': {notifyFilterContentUpdated: () => {
            filterUpdates++;
            if(filterFailure)throw Error('Optional filter unavailable');
        }},
    };
    factory(...deps.map(dep => modules[dep]));
    window.conversation = exports;
};
</script><script src="../../amd/build/conversation.min.js"></script><script>
const q = selector => document.querySelector('#fixture ' + selector);
const assert = (condition, message) => {if (!condition) throw Error(message);};
const settle = () => new Promise(resolve => setTimeout(resolve, 0));

    assert(cards.length===skillExamples.length,'A skill card is missing or duplicated');
    cards.forEach((card,index)=>{
        assert(card.querySelector('h6').textContent===skillExamples[index].name,'Skill names changed order');
        assert(Array.from(card.querySelectorAll('dt')).map(node=>node.textContent).join('|')==='Judgement|Comment',

            ===skillExamples[index].verdict+'|'+skillExamples[index].comment,'A verdict or comment changed');
        for(const node of card.querySelectorAll('h6,dt,dd')) {

const assertSkillCardsFit = panel => {
    const cards=Array.from(panel.querySelectorAll('.masteryagent-skill-card'));
    const bounds=panel.getBoundingClientRect();

    for(const card of cards) {

        assert(box.left>=bounds.left-1 && box.right<=bounds.right+1,'A skill card extended outside the parent');
        for(const node of [card,...card.querySelectorAll('h6,dl,dt,dd')]) {

    pending.length = 0; filterUpdates = 0; filterFailure = false;
    if (!preservePreference) {
        try {window.sessionStorage.removeItem('masteryagent-announcement-mode');} catch (error) {}
    }
    document.querySelector('#fixture').innerHTML = `<a id="outside-app" href="#summary">Course navigation</a>
<div id="masteryagent-app" class="masteryagent-app" data-cmid="42" data-processing="Working" data-updated="Updated" data-error="Request failed" data-unsent="Send or clear your draft first" data-confirmrequired="Confirm final submission" data-resultsready="Results and feedback are ready" data-newfeedback="New evaluator feedback is available beside your reply box."
data-processing-start="Working" data-processing-reply="Working" data-processing-finish="Working" data-processing-pause="Working" data-processing-clarify="Clarifying the question without using a reply." data-processing-slow="Still working; please wait."
data-recovery-reply="Your answer is still here. Retry sending it when ready." data-recovery-action="Check the latest conversation before trying again." data-recovery-stale="Review the latest conversation before sending anything else." data-recovery-draft="Copy the recovered draft before continuing." data-recovery-clarify="Your answer was not submitted for assessment. Try Clarify this question again." data-clarificationready="Question clarification is ready beside your reply.">
<div data-region="request-feedback" class="masteryagent-request-feedback" data-state="idle" hidden>
<div data-region="error" role="alert" tabindex="-1" aria-describedby="masteryagent-request-help" hidden></div><div data-region="status" aria-hidden="true"></div>
<p data-region="request-help" id="masteryagent-request-help" hidden></p></div>
<div data-region="announcements" class="masteryagent-sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<div data-region="reply-limit-announcement" class="masteryagent-sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
${includePreference ? `<div class="masteryagent-announcement-settings" data-region="announcement-settings" hidden><label for="announcement-mode">Screen-reader updates</label>
<select id="announcement-mode" data-region="announcement-mode"><option value="brief">Brief notifications</option>
<option value="full">Read full feedback</option></select></div>` : ''}
<div data-region="draft" ${recoveredText ? '' : 'hidden'}><textarea readonly>${escapeText(recoveredText)}</textarea></div><div data-region="content" aria-busy="false">${html}</div></div>`;

const submit = (action, reply) => {
    if (reply !== undefined) q('[name="reply"]').value = reply;
    const button = q(`button[name="action"][value="${action}"]`);
    if (button) button.form.requestSubmit(button);
    else q(`form[data-action="${action}"]`).requestSubmit();
};
const respond = async (html, stale = false, warning = '') => {
    pending.at(-1).resolve({html, stale, warning}); await settle();
};
const inputReply = value => {
    const editor=q('[name="reply"]');editor.value=value;
    editor.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'insertText'}));
    return editor;
};
const navigationWouldWarn = () => {
    // Dispatch the cancelable event only; do not open an actual browser navigation dialog in the harness.
    const event=new Event('beforeunload',{cancelable:true});window.dispatchEvent(event);return event.defaultPrevented;
};
const withUnloadListeners = async run => {
    const originalAdd=window.addEventListener;const originalRemove=window.removeEventListener;const attached=new Set();
    window.addEventListener=function(type,handler,...args){
        if(type==='beforeunload')attached.add(handler);
        return originalAdd.call(this,type,handler,...args);
    };
    window.removeEventListener=function(type,handler,...args){
        if(type==='beforeunload')attached.delete(handler);
        return originalRemove.call(this,type,handler,...args);
    };
    try{await run(attached);}finally{window.addEventListener=originalAdd;window.removeEventListener=originalRemove;}
};
let nextSlowTimerId=1000000;
const withSlowClock = async run => {
    const originalSet=window.setTimeout;const originalClear=window.clearTimeout;const timers=[];
    window.setTimeout=(callback,delay,...args)=>{
        if(Number(delay)!==15000)return originalSet(callback,delay,...args);
        const timer={id:nextSlowTimerId++,callback:()=>callback(...args),cleared:false,fired:false};
        timers.push(timer);return timer.id;
    };
    window.clearTimeout=id=>{
        const timer=timers.find(item=>item.id===id);
        if(timer)timer.cleared=true;else originalClear(id);
    };
    const clock={timers,active:()=>timers.filter(timer=>!timer.cleared&&!timer.fired),
        fire:(timer,evenIfCancelled=false)=>{
            if(timer && (!timer.cleared&&!timer.fired || evenIfCancelled)){timer.fired=true;timer.callback();}
        }};
    try{await run(clock);}finally{window.setTimeout=originalSet;window.clearTimeout=originalClear;}
};
const tests = [
['Navigation warnings attach only for unsaved edits and disappear when the answer is reverted', async () => {
    await withUnloadListeners(async attached=>{
        mount(active());assert(!navigationWouldWarn() && attached.size===0,'Blank initial reply attached a warning');
        inputReply('Unsaved answer');assert(navigationWouldWarn() && attached.size===1,'Unsaved typing was not protected');
        window.conversation.init('#masteryagent-app');inputReply('Unsaved answer with more detail');
        assert(attached.size===1,'Repeated initialization or typing added duplicate warning listeners');
        inputReply('');assert(!navigationWouldWarn() && attached.size===0,'Reverting all edits left a warning listener');
    });
}],
['Unchanged saved drafts are clean while deleting or editing them warns until an exact restoration', async () => {
    const saved='Saved "answer" & details\nSecond line.';

    assert(!navigationWouldWarn(),'An unchanged saved draft or normalized newline triggered a warning');
    inputReply('');assert(navigationWouldWarn(),'Deleting a saved answer was treated as already saved');
    inputReply(saved);assert(!navigationWouldWarn(),'Restoring the exact saved answer remained dirty');
    inputReply(saved+' ');assert(navigationWouldWarn(),'Unsaved trailing whitespace was silently ignored');
    inputReply(saved);assert(!navigationWouldWarn(),'Returning to the saved text did not clear the warning');
    mount(active('legacy',1,'Older saved draft').replace(' data-saved-draft="Older saved draft"',''));
    assert(!navigationWouldWarn(),'An older fragment without the baseline attribute lost defaultValue fallback');
}],
['Server-rendered unsaved overrides use the saved baseline instead of the textarea default value', async () => {

    assert(navigationWouldWarn(),'Initial failed-POST override was incorrectly considered saved');

    mount(active('state2',1,'','Previously saved answer'));
    assert(navigationWouldWarn(),'An explicitly cleared override lost its unsaved deletion');
}],
['Pending and failed replies retain navigation protection until a confirmed successful response', async () => {
    mount(active());inputReply('My new answer');submit('reply');

}],
['Stale responses preserve unsaved text and intentional saved-draft deletions against the new baseline', async () => {
    for(const draft of ['Unsent local answer','']) {

['Clarification preserves dirty answers and deletions without making an untouched saved answer dirty', async () => {

['Visible recovered text warns on navigation until an accepted action clears it', async () => {

    mount(`<section data-region="current-lesson">${message}</section>${active()}`);
    submit('reply','Answer');q('#reading-now').focus();
    await respond(`<details data-region="lesson-history" data-section-key="just-closed"><summary>Earlier lesson</summary>${message}</details>${active('state2',3)}`);
    assert(q('[data-region="lesson-history"]').open,'Focused message was hidden after the lesson closed');
    assert(document.activeElement===q('#reading-now'),'Reading focus was lost after the lesson closed');
}],
['Only new evaluator content is announced, using text rather than HTML', async () => {
    mount(navigable());assert(q('[data-region="announcements"]').textContent==='','Initial history was announced');
    chooseMode('full');
    submit('reply','Answer');assert(q('[data-region="announcements"]').textContent==='Working','Processing was not announced');
    await respond(navigable('state2',3).replace('Question 3','&lt;img src=x&gt; New feedback'));
    const region=q('[data-region="announcements"]');
    assert(region.textContent==='<img src=x> New feedback','Old messages or status mixed with new feedback');
    assert(!region.querySelector('img'),'Announcement interpreted text as HTML');
    assert(region.getAttribute('aria-live')==='polite','Announcement is not polite');
}],
['Brief notifications are the default and leave detailed feedback beside the reply', async () => {
    mount(active());assert(!q('[data-region="announcement-settings"]').hidden,'Preference remained hidden with JavaScript enabled');
    assert(q('[data-region="announcement-mode"]').value==='brief','Brief notifications are not the default');
    submit('reply','Answer');await respond(active('state2',3));
    assert(q('[data-region="announcements"]').textContent==='New evaluator feedback is available beside your reply box.','Brief notification missing');
    assert(!q('[data-region="announcements"]').textContent.includes('Question 3'),'Brief mode read full feedback');
}],
['Announcement preference survives a fresh initialization in the same tab', async () => {
    mount(active());chooseMode('full');mount(active(),{preservePreference:true});
    assert(q('[data-region="announcement-mode"]').value==='full','Stored preference was lost');
    submit('reply','Answer');await respond(active('state2',3));
    assert(q('[data-region="announcements"]').textContent==='Question 3','Restored full mode was ignored');
    assert(!Object.keys(pending[0].request.args).some(key=>/announcement|preference|mode/i.test(key)),'Preference was sent to the server');
}],
['Invalid stored announcement preferences keep the accessible default', async () => {
    mount(active());window.sessionStorage.setItem('masteryagent-announcement-mode','unexpected');
    mount(active(),{preservePreference:true});
    assert(q('[data-region="announcement-mode"]').value==='brief','Invalid preference removed the default selection');
}],
['Unavailable session storage does not prevent choosing feedback or sending a reply', async () => {
    const descriptor=Object.getOwnPropertyDescriptor(window,'sessionStorage');
    try {
        Object.defineProperty(window,'sessionStorage',{configurable:true,get(){throw new DOMException('Blocked','SecurityError');}});
        mount(active());chooseMode('full');submit('reply','Answer');await respond(active('state2',3));
        assert(q('[data-region="announcements"]').textContent==='Question 3','Unavailable storage broke full feedback');
        assert(q('[data-region="error"]').hidden,'Unavailable storage blocked the request');
    } finally {Object.defineProperty(window,'sessionStorage',descriptor);}
}],
['Preference changes during processing apply to the next response without replaying text', async () => {
    mount(active());submit('reply','Answer');q('[data-region="announcement-mode"]').focus();chooseMode('full');
    assert(q('[data-region="announcements"]').textContent==='Working','Changing preference replayed feedback');
    await respond(active('state2',3));
    assert(q('[data-region="announcements"]').textContent==='Question 3','Response ignored the latest preference');
    assert(document.activeElement===q('[data-region="announcement-mode"]'),'Response stole focus from the preference');
    chooseMode('brief');
    assert(q('[data-region="announcements"]').textContent==='Question 3','Changing preference replayed a notification');
    assert(document.activeElement===q('[data-region="announcement-mode"]'),'Changing preference moved focus');
}],
['Outside navigation retains focus on successful, stale and failed responses', async () => {
    for(const result of ['success','stale','error']) {
        mount(active());submit('reply','Answer');q('#outside-app').focus();
        if(result==='error'){pending.at(-1).reject(Error('Offline'));await settle();}
        else await respond(active('state2',3),result==='stale','Changed in another tab');
        assert(document.activeElement===q('#outside-app'),`${result} response stole focus from course navigation`);
        if(result!=='success') assert(!q('[data-region="error"]').hidden,'Error was hidden when focus stayed outside');
    }
}],
['Successful updates scroll the focused reply or results into view', async () => {
    const original=Element.prototype.scrollIntoView;let scrolled;
    Element.prototype.scrollIntoView=function(options){scrolled=this;return original.call(this,options);};
    try {
        mount();submit('start');
        await respond(active().replace('Question 1','<div style="height:1200px">Long question</div>'));
        assert(document.activeElement===q('[name="reply"]') && scrolled===document.activeElement,'Start focused and scrolled to different elements');
        submit('reply','Answer');await respond(active('state2',3).replace('Question 3','<div style="height:1200px">Long feedback</div>'));
        assert(document.activeElement===q('[name="reply"]') && scrolled===document.activeElement,'Reply focused and scrolled to different elements');
        const bounds=document.activeElement.getBoundingClientRect();
        // Layout bounds can be fractional while the browser rounds the document scroll offset.
        assert(bounds.top>=-1 && bounds.bottom<=window.innerHeight+1,
            `Focused reply was not visible: top=${bounds.top}, bottom=${bounds.bottom}, viewport=${window.innerHeight}, scroll=${window.scrollY}`);
        submit('finish');await respond(finished());
        assert(document.activeElement===q('[data-region="results"]') && scrolled===document.activeElement,'Results focused and scrolled to different elements');
    } finally {Element.prototype.scrollIntoView=original;}
}],
['Original scenario expansion and focus survive updates within the same lesson', async () => {
    mount(scenario()+active());submit('reply','Answer');q('#scenario-lesson1').click();q('#scenario-lesson1').focus();
    await respond(scenario()+active('state2',3));
    assert(q('[data-region="original-scenario"]').open,'Open scenario was collapsed');
    assert(document.activeElement===q('#scenario-lesson1'),'Scenario reading focus was lost');
    submit('reply','Another answer');q('#scenario-lesson1').click();
    await respond(scenario('lesson1',true)+active('state3',5));
    assert(!q('[data-region="original-scenario"]').open,'Closed scenario was reopened');
}],
['Original scenario expansion resets when the next lesson begins', async () => {
    mount(scenario('lesson1',true)+active());submit('reply','Answer');
    await respond(scenario('lesson2')+active('state2',3));
    assert(!q('[data-region="original-scenario"]').open,'New lesson inherited the earlier scenario expansion');
}],
['Full feedback announcements ignore the copy next to the answer field', async () => {
    mount(active());chooseMode('full');submit('reply','Answer');
    await respond(active('state2',3)+'<section data-region="reply-context"><div class="masteryagent-context-text">Question 3</div></section>');
    assert(q('[data-region="announcements"]').textContent==='Question 3','Context copy was announced twice');
}],
['Older wrappers without a preference keep full feedback announcements', async () => {
    mount(active(),{includePreference:false});submit('reply','Answer');await respond(active('state2',3));
    assert(q('[data-region="announcements"]').textContent==='Question 3','Legacy wrapper lost its feedback announcement');
}],
['Stale and failed responses clear processing without replaying transcript', async () => {
    mount(navigable());submit('reply','Answer');await respond(navigable('state2',3),true,'Changed in another tab');
    assert(q('[data-region="announcements"]').textContent==='','Stale transcript was announced');
    submit('reply');pending.at(-1).reject(Error('Offline'));await settle();
    assert(q('[data-region="announcements"]').textContent==='','Processing announcement remained after failure');
}],
['Final results are announced while preserving an open history section', async () => {
    mount(navigable('state1',1,true));submit('finish');await respond(history()+finished());
    assert(q('[data-region="announcements"]').textContent==='Results and feedback are ready','Results announcement missing');
    assert(q('[data-region="lesson-history"]').open,'Open history lost on completion');
    assert(document.activeElement===q('[data-region="results"]'),'Results were not focused');
}],
['Long message text wraps within a narrow conversation panel', async () => {
    mount(`<div class="masteryagent-message">${'LongUnbrokenWord'.repeat(60)}</div>`);
    const panel=q('[data-region="content"]');panel.style.width='240px';
    assert(panel.scrollWidth<=panel.clientWidth+1,'Long text caused horizontal overflow');
}],
['Begin updates the page and focuses the reply without navigation', async () => {
    mount(); submit('start');
    assert(q('button').disabled, 'Start button should be disabled while processing');
    assert(q('[data-region="status"]').textContent === 'Working', 'Loading feedback missing');
    assert(pending[0].request.args.cmid === 42 && pending[0].request.args.state === 'new', 'Wrong service parameters');
    await respond(active());
    assert(document.activeElement === q('[name="reply"]'), 'Reply box was not focused');
    assert(filterUpdates === 1, 'Moodle filters were not notified');
}],
['Repeated submit and finish are blocked while a reply is pending', async () => {
    mount(active()); submit('reply', 'My answer');
    for(const action of ['reply','finish']) q('form').dispatchEvent(new SubmitEvent('submit',{
        bubbles:true,cancelable:true,submitter:q(`button[value="${action}"]`)}));
    assert(pending.length === 1, 'Duplicate request sent');
    assert(q('[name="reply"]').readOnly, 'Reply remained editable while pending');
    assert(q('button[value="finish"]').disabled, 'Finish remained enabled');
    await respond(active('state2',3));
    assert(q('[name="reply"]').value === '', 'Successful reply did not clear draft');
    assert(!q('[name="reply"]').readOnly, 'Reply remained read-only');
}],
['The delegated handler survives three consecutive replies', async () => {
    mount(active());
    for(let i=1;i<=3;i++){submit('reply',`Answer ${i}`);assert(pending.length===i,'Handler lost or duplicated');await respond(active('state'+(i+1),2*i+1));}
}],
['Finish displays results and retry opens a fresh conversation', async () => {
    mount(active());submit('finish');await respond(finished());
    assert(document.activeElement === q('[data-region="results"]'), 'Results not focused');
    submit('start');assert(pending.at(-1).request.args.state === 'finished','Retry used wrong revision');
    await respond(active('newattempt',10));assert(q('[name="reply"]'),'New attempt missing');
}],
['Provider errors preserve drafts and safely display error text', async () => {
    mount(active());submit('reply','My unsent answer');
    pending[0].reject({message:'<img src=x onerror=alert(1)> Provider error'});await settle();
    assert(q('[name="reply"]').value==='My unsent answer','Draft lost');
    assert(!q('[data-region="error"] img'),'Error HTML executed');
    assert(!q('form[data-action="reply"] button').disabled,'Submit remains disabled');
    assert(q('form[data-action="reply"] [name="state"]').value==='state1','Revision changed on failure');
}],
['Transport errors never replay a write automatically', async () => {
    mount(active());submit('reply','Possibly saved');pending[0].reject('Connection lost');await settle();
    assert(pending.length===1,'Write replayed automatically');
    submit('reply');assert(pending.at(-1).request.args.state==='state1','Manual retry must retain old revision');
    await respond(active('state2',3),true,'Review latest conversation');
    assert(q('[name="reply"]').value==='Possibly saved','Draft lost after ambiguous result');
}],
['Stale responses render the latest conversation and retain the draft', async () => {
    mount(active());submit('reply','My other-tab draft');await respond(active('state9',9),true,'Conversation changed');
    assert(q('[name="reply"]').value==='My other-tab draft','Draft lost');
    assert(q('form[data-action="reply"] [name="state"]').value==='state9','Revision not updated');
    assert(q('[data-region="error"]').textContent==='Conversation changed','Warning missing');
}],
['Already-finished stale responses preserve a copyable draft', async () => {
    mount(active());submit('reply','Keep this text');await respond(finished(),true,'Already finished');
    assert(!q('[data-region="draft"]').hidden,'Recovered draft is hidden');
    assert(q('[data-region="draft"] textarea').value==='Keep this text','Recovered draft lost');
}],
['Blank and whitespace-only replies send no request', async () => {
    mount(active());submit('reply','');submit('reply','   \n  ');assert(pending.length===0,'Blank reply sent');
}],
['Initializing twice does not create duplicate listeners', async () => {
    mount();window.conversation.init('#masteryagent-app');submit('start');assert(pending.length===1,'Duplicate listener');await respond(active());
}],
['Malformed responses keep the current form and draft usable', async () => {
    mount(active());submit('reply','Keep my draft');pending[0].resolve({unexpected:true});await settle();
    assert(q('[name="reply"]').value==='Keep my draft','Draft lost');
    assert(!q('form[data-action="reply"] button').disabled,'Form disabled after error');
    assert(!q('[data-region="error"]').hidden,'Error missing');
}],
['Opening and closing final confirmation keeps the draft and sends nothing', async () => {
    mount(active());q('[name="reply"]').value='Still writing';
    assert(!q('details').open,'Confirmation should begin closed');
    q('summary').click();assert(q('details').open,'Confirmation did not open');
    q('summary').click();assert(!q('details').open,'Confirmation did not close');
    assert(pending.length===0,'Opening confirmation submitted the assessment');
    assert(q('[name="reply"]').value==='Still writing','Draft changed');
}],
['Unsent text blocks final submission until it is sent or cleared', async () => {
    mount(active());submit('finish','Still writing');
    assert(pending.length===0,'Unsent answer was discarded');
    assert(q('[data-region="error"]').textContent==='Send or clear your draft first','Missing draft warning');
    assert(document.activeElement===q('[name="reply"]'),'Draft should receive focus');
    assert(q('[name="reply"]').value==='Still writing','Draft lost');
    submit('finish','');
    assert(pending.length===1 && pending[0].request.args.action==='finish','Empty reply incorrectly blocked finish');
    assert(pending[0].request.args.confirmed===true,'Explicit confirmation missing');
    await respond(finished());
}],
['Save and leave uses a native POST containing the exact draft and pause action', async () => {
    for(const draft of ['', '  Unsent answer\nsecond line']) {
        mount(active());let captured;
        q('#masteryagent-app').addEventListener('submit',event=>{
            captured={blocked:event.defaultPrevented,data:new FormData(event.target,event.submitter)};
            event.preventDefault();
        },{once:true});
        submit('pause',draft);
        assert(captured && !captured.blocked,'Save and leave should use normal form submission');
        assert(captured.data.get('action')==='pause','Pause action missing from POST');
        assert(captured.data.get('reply')===draft,'Draft changed or missing from POST');
        assert(captured.data.get('state')==='state1','Revision missing from POST');
        assert(pending.length===0,'Pause called the AI conversation AJAX action');
    }
}],
['Save and leave is blocked while an answer is being processed', async () => {
    mount(active());submit('reply','Already sending');
    const event=new SubmitEvent('submit',{bubbles:true,cancelable:true,submitter:q('button[value="pause"]')});
    q('form').dispatchEvent(event);
    assert(event.defaultPrevented,'Pause navigated away during a reply');
    assert(pending.length===1,'Concurrent request created');
    await respond(active('state2',3));
}],
['An old form without confirmation cannot finalize an attempt', async () => {
    mount(active());q('[name="confirmed"]').remove();submit('finish');
    assert(pending.length===0,'Unconfirmed request sent');
    assert(q('[data-region="error"]').textContent==='Confirm final submission','Confirmation warning missing');
}],
['Returning through browser history restores usable controls after pausing', async () => {
    mount(active());
    q('#masteryagent-app').addEventListener('submit',event=>event.preventDefault(),{once:true});
    submit('pause','Saved for later');
    window.dispatchEvent(new PageTransitionEvent('pageshow',{persisted:true}));
    assert(q('[data-region="status"]').textContent==='','Stale processing status remained');
    submit('reply','Saved for later');
    assert(pending.length===1,'Back navigation left the conversation blocked');
    await respond(active('state2',3),true,'Review latest conversation');
    assert(q('[name="reply"]').value==='Saved for later','History recovery lost the draft');
}],
];
(async()=>{
    let passed=0;
    for(const [name,run] of tests){const li=document.createElement('li');try{await run();passed++;li.className='pass';li.textContent='PASS — '+name;}catch(e){li.className='fail';li.textContent='FAIL — '+name+': '+e.message;}document.querySelector('#results').append(li);}
    document.querySelector('#summary').textContent=`${passed}/${tests.length} tests passed`;
    document.title=`${passed}/${tests.length} — Mastery agent AJAX tests`;
})();
</script></body></html>
